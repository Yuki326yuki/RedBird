paths:
  input_dir: data/sdg13_policy_collection/original_documents
  workdir: data/work/sdg13_china_us_mexico/local_2_each_qwen25_7b_bf16
  output_dir: data/output/sdg13_china_us_mexico/local_2_each_qwen25_7b_bf16
  prompt_dir: prompts/sdg13_v2

manifest_path: data/sdg13_policy_collection/download_manifest.csv
countries:
  - China
  - United States
  - Mexico

cache:
  enabled: true
  documents_path: data/cache/sdg13_china_us_mexico/documents.jsonl
  documents_meta_path: data/cache/sdg13_china_us_mexico/documents.meta.json
  chunks_path: data/cache/sdg13_china_us_mexico/chunks.jsonl
  chunks_meta_path: data/cache/sdg13_china_us_mexico/chunks.meta.json

experiment:
  max_chunks: 300
  target_policies_per_country: 2
  require_policy_quota: true
  sdg13_filter: true
  strict_sdg13: true
  balance_by: country_file
  neighbor_chunks: 1
  preflight_chunks: 3
  preflight_max_seconds_per_chunk: 180
  max_consecutive_oom: 3
  fail_on_chunk_errors: true
  min_records: 1

chunking:
  max_chars: 2400
  overlap_chars: 300

model:
  backend: local_transformers
  name: Qwen2.5-7B-Instruct
  local_model_path: /hpc2hdd/home/czhang162/models/Qwen2.5-7B-Instruct
  temperature: 0
  max_tokens: 512
  oom_retry_max_tokens: 256
  max_input_tokens: 6144
  torch_dtype: auto
  attn_implementation: sdpa
  quantization:
    mode: none
  use_chat_template: true
  enable_thinking: false
  raise_on_parse_error: true

target_classification:
  enabled: true
  prompt_path: prompts/targeting/sdg13_targets.md
  cache_path: target_classifications.jsonl
  min_confidence: 0.75
  model:
    backend: local_transformers
    name: Qwen2.5-7B-Instruct
    local_model_path: /hpc2hdd/home/czhang162/models/Qwen2.5-7B-Instruct
    temperature: 0
    max_tokens: 700
    oom_retry_max_tokens: 350
    max_input_tokens: 6144
    torch_dtype: auto
    attn_implementation: sdpa
    quantization:
      mode: none
    use_chat_template: true
    enable_thinking: false
    raise_on_parse_error: true

review:
  enabled: true
  stage: chunk_record
  prompt_path: prompts/review/sdg13_v2.md
  cache_path: reviews.jsonl
  keep_rejected: false
  min_confidence: 0.75
  enforce_traceable_evidence: true
  model:
    backend: local_transformers
    name: Qwen2.5-7B-Instruct
    local_model_path: /hpc2hdd/home/czhang162/models/Qwen2.5-7B-Instruct
    temperature: 0
    max_tokens: 350
    oom_retry_max_tokens: 175
    max_input_tokens: 6144
    torch_dtype: auto
    attn_implementation: sdpa
    quantization:
      mode: none
    use_chat_template: true
    enable_thinking: false
    raise_on_parse_error: true

translation:
  enabled: true
  output_language: English
  prompt_path: prompts/translation/en_policy.md
  cache_path: translations.jsonl
  model:
    backend: local_transformers
    name: Qwen2.5-7B-Instruct
    local_model_path: /hpc2hdd/home/czhang162/models/Qwen2.5-7B-Instruct
    temperature: 0
    max_tokens: 1800
    oom_retry_max_tokens: 900
    max_input_tokens: 6144
    torch_dtype: auto
    attn_implementation: sdpa
    quantization:
      mode: none
    use_chat_template: true
    enable_thinking: false
    raise_on_parse_error: true

database:
  db_path: data/db/redbird_sdg13_china_us_mexico_2_each_qwen25_7b_bf16.sqlite

chatbot:
  enabled: true
  db_path: data/db/redbird_sdg13_china_us_mexico_2_each_qwen25_7b_bf16.sqlite
  prompt_path: prompts/chatbot/policy_qa.md
  top_k: 8
  aggregate_limit: 200
  require_reviewed: false
  allow_general_knowledge: true
  conversation_turn_limit: 8
  llm_query_planning: true
  llm_reranking: true
  rerank_candidates: 20
  model:
    backend: api
    name: gpt-5.6-luna
    api_base: https://api.openlux.ai/v1
    api_key_env: OPENAI_API_KEY
    api_protocol: auto
    temperature: 0
    reasoning_effort: medium
    max_tokens: 1800
    json_mode: false
