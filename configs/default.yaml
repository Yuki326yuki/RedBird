paths:
  input_dir: data/input
  workdir: data/work
  output_dir: data/output
  prompt_dir: prompts

chunking:
  max_chars: 6000
  overlap_paragraphs: 0

model:
  backend: api
  name: gpt-4.1-mini
  api_base: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0
  max_tokens: 4000
  json_mode: true
  local_model_path: ""

translation:
  enabled: true
  output_language: English
  prompt_path: prompts/translation/en_policy.md
  cache_path: translations.jsonl
  model:
    backend: api
    name: gpt-4.1-mini
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 1500
    json_mode: true
