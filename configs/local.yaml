paths:
  input_dir: data/input
  workdir: data/work
  output_dir: data/output
  prompt_dir: prompts

chunking:
  max_chars: 6000
  overlap_paragraphs: 0

model:
  backend: local_transformers
  name: Qwen2.5-1.5B-Instruct
  api_base: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0
  max_tokens: 4000
  json_mode: true
  local_model_path: /hpc2hdd/home/czhang162/models/Qwen2.5-1.5B-Instruct

translation:
  enabled: true
  output_language: English
  prompt_path: prompts/translation/en_policy.md
  cache_path: translations.jsonl
  model:
    backend: local_transformers
    name: Qwen3-32B
    temperature: 0
    max_tokens: 4000
    json_mode: true
    local_model_path: /hpc2hdd/home/czhang162/models/Qwen3-32B
    torch_dtype: auto
    use_chat_template: true
    enable_thinking: false
